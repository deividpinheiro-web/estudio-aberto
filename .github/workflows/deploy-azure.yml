# Publica o site (HTML/CSS/JS) no Azure App Service a cada push na branch main.
name: Deploy Azure
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar o pacote do site
        run: |
          mkdir pacote
          cp index.html script.js style.css icone.ico pacote/
          cp -r audio img pacote/

      - name: Publicar no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: pacote
